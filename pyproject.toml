[project]
name = "cve-agent"
version = "0.1.0"
description = "Evidence-backed multi-label CVE classification"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.0.0",
    "pytest>=9.1.1",
    "trafilatura>=2.2.0",
]

[project.scripts]
cve-agent = "cve_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
