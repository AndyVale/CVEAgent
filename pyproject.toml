[project]
name = "cve-agent"
version = "0.1.0"
description = "Evidence-backed multi-label CVE classification"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "httpx>=0.28.1",
    "openai>=3.0.0",
    "tenacity>=9.1.4",
    "tomlkit>=0.13.3",
    "trafilatura>=2.2.0",
]

[project.scripts]
cve-agent = "cve_agent.cli.commands:main"
cve-agent-gui = "cve_agent.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/ARCHITECTURE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
