[runtime]
# OpenAI-compatible provider base URL
endpoint = "https://openrouter.ai/api/v1"
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
max_tokens = 2048
temperature = 0.0
top_p = 1.0
timeout_seconds = 120
retry_count = 2
retry_wait_seconds = 1.0
retry_max_wait_seconds = 8.0
min_request_interval_seconds = 0.0

[nvd]
base_url = "https://services.nvd.nist.gov/rest/json/cves/2.0"
timeout_seconds = 20
retry_count = 2

[web]
provider = "tavily"
tavily_base_url = "https://api.tavily.com"
tavily_max_results = 5
tavily_search_depth = "basic"
timeout_seconds = 20
retry_count = 2
cache_dir = ".cache/cve-agent/web"
max_document_chars = 100000
max_preview_chars = 12000
max_download_bytes = 2000000

[storage]
database = ".data/cve-agent.sqlite3"

[limits]
token_budget = 12000
max_agent_turns = 12
max_search_calls = 5
max_fetch_calls = 8
max_investigation_seconds = 300
max_input_tokens_per_request = 12000
finalization_overrun_percent = 15.0

[classification]
strategy = "auto"
pruning_confidence_threshold = 0.8
